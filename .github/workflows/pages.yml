name: Deploy research portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mfq-portfolio/package-lock.json
      - name: Install locked dependencies
        working-directory: mfq-portfolio
        run: npm ci --no-audit --no-fund
      - name: Check authoritative content
        working-directory: mfq-portfolio
        run: npm test
      - name: Build site at /about/
        working-directory: mfq-portfolio
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mfq-portfolio/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
